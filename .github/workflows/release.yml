name: Release Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/liferay-intellij-deployer-*.zip
          generate_release_notes: true

      - name: Update updatePlugins.xml
        run: |
          VERSION=${{ steps.version.outputs.version }}
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/liferay-intellij-deployer-${VERSION}.zip"
          cat > updatePlugins.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
              <plugin
                  id="com.liferay.remote-deployer"
                  url="${ZIP_URL}"
                  version="${VERSION}">
                  <idea-version since-build="251"/>
                  <description>Deploy Liferay artifacts to remote servers via SSH.</description>
              </plugin>
          </plugins>
          EOF

      - name: Commit updatePlugins.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updatePlugins.xml
          git commit -m "chore: update updatePlugins.xml for ${{ github.ref_name }}"
          git push origin HEAD:main
